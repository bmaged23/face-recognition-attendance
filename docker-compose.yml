services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "5333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  face_recognition:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    env_file:
      - .env
    ports:
      - "7323:7323"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
      DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
    depends_on:
      - qdrant
    restart: unless-stopped
volumes:
  qdrant_data:
