name: Evaluated GPU image release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'face_recognition/**'
      - 'vendor/**'
      - 'scripts/**'
      - '!scripts/documentation/**'
      - '!scripts/**/*.md'
      - 'tests/**'
      - 'evaluation/**'
      - 'requirements*.txt'
      - 'requirements/**'
      - 'deployment/docker/Dockerfile'
      - '*.py'
      - '.dockerignore'
      - '.github/workflows/release.yml'
permissions:
  contents: read
concurrency:
  group: face-container-release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/checks.yml
  build:
    needs: tests
    if: github.repository == 'bmaged23/face-recognition-attendance' && github.actor == 'bmaged23' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/bmaged23/face-recognition-candidates@${{ steps.image.outputs.digest }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free unused hosted build tooling
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        id: image
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/bmaged23/face-recognition-candidates:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=face-recognition
          cache-to: type=gha,scope=face-recognition,mode=max
  qualify:
    needs: build
    runs-on: [self-hosted, Linux, X64, face-gpu]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach isolated evaluation tools and frozen local research fixtures
        run: |
          ln -s /home/bmage/projects/face-recognition-attendance/.venv .venv
          mkdir -p input
          ln -s /home/bmage/projects/face-recognition-attendance/input/recognition-evaluation input/recognition-evaluation
      - name: Pull exact candidate
        run: docker pull "$CANDIDATE"
      - name: Container tests, 228 real GPU probes, API and persistence gate
        run: |
          mkdir -p output
          .venv/bin/python scripts/evaluation/monitor_container_resources.py --output output/container-resources.json &
          monitor=$!
          trap 'kill -TERM "$monitor" 2>/dev/null || true; wait "$monitor" || true' EXIT
          .venv/bin/python scripts/release/qualify_image.py --image "$CANDIDATE" --source-sha "$GITHUB_SHA"
      - name: Save aggregate qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: face-container-qualification
          path: |
            output/container-gate/gate-summary.json
            output/container-resources.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain detailed research outputs privately
        if: always()
        run: |
          archive="/home/bmage/projects/face-recognition-attendance/output/ci-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p -m 700 "$archive"
          if [ -d output/container-gate ]; then cp -a output/container-gate/. "$archive/"; fi
          if [ -f output/container-resources.json ]; then cp output/container-resources.json "$archive/"; fi
  publish:
    needs: [build, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE: bmaged23/face-recognition-attendance
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install registry-copy tool if needed
        run: |
          if ! command -v skopeo; then
            timeout 120s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y skopeo
          fi
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4.7.0
        with:
          username: bmaged23
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish only the qualified manifest
        run: |
          for tag in gpu sha-$GITHUB_SHA; do
            skopeo copy --preserve-digests --authfile "$HOME/.docker/config.json" "docker://$CANDIDATE" "docker://$IMAGE:$tag"
          done
          mkdir -p "$RUNNER_TEMP/anonymous"
          printf '{"auths":{}}' > "$RUNNER_TEMP/anonymous/auth.json"
          skopeo inspect --authfile "$RUNNER_TEMP/anonymous/auth.json" --raw "docker://$IMAGE:gpu" > "$RUNNER_TEMP/manifest.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d' ' -f1)" = "$DIGEST"
      - name: Publish source links and usage guide
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python scripts/release/update_dockerhub.py
  verify-public:
    needs: [build, publish]
    runs-on: [self-hosted, Linux, X64, face-gpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Anonymous pull and exact identity check
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/face-anonymous"
          printf '{"auths":{}}' > "$RUNNER_TEMP/face-anonymous/config.json"
          docker --config "$RUNNER_TEMP/face-anonymous" pull bmaged23/face-recognition-attendance:gpu
          docker image inspect bmaged23/face-recognition-attendance:gpu --format '{{json .RepoDigests}}' | grep -F "$DIGEST"
      - name: Normal public-image startup, GPU API and persistent gallery
        run: |
          ln -s /home/bmage/projects/face-recognition-attendance/.venv .venv
          mkdir -p input
          ln -s /home/bmage/projects/face-recognition-attendance/input/recognition-evaluation input/recognition-evaluation
          .venv/bin/python scripts/release/qualify_image.py --image bmaged23/face-recognition-attendance:gpu --source-sha "$GITHUB_SHA" --public-smoke --output output/public-image-gate
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: face-public-verification
          path: output/public-image-gate/gate-summary.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain public-image smoke outputs privately
        if: always()
        run: |
          archive="/home/bmage/projects/face-recognition-attendance/output/ci-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-public"
          mkdir -p -m 700 "$archive"
          if [ -d output/public-image-gate ]; then cp -a output/public-image-gate/. "$archive/"; fi
